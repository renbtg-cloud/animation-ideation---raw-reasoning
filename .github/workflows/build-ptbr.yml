name: Build Brazilian Portuguese dossier
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-ptbr.yml
      - scripts/translate_ptBR.py
      - scripts/build_pdf_ptBR.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install translation and PDF dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'requests>=2.31,<3' 'markdown-it-py>=3,<5' 'weasyprint>=62,<70' 'pypdf>=5,<8'

      - name: Translate complete manuscript with contextual corrections
        run: python -u scripts/translate_ptBR.py

      - name: Generate illustrated Brazilian Portuguese PDF
        run: python scripts/build_pdf_ptBR.py

      - name: Verify Markdown and PDF completeness
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from pypdf import PdfReader
          original = Path("README.md").read_text("utf-8")
          translated = Path("README-ptBR.md").read_text("utf-8")
          assert len(original.splitlines()) == len(translated.splitlines()), "Missing lines"
          assert len(re.findall(r"^#{1,4} ", original, re.M)) == len(re.findall(r"^#{1,4} ", translated, re.M)), "Missing headings"
          assert len(translated) >= .62*len(original), "Partial translation"
          pdf = PdfReader("README-ptBR.pdf")
          assert len(pdf.pages) > 25, "PDF too short"
          assert Path("README-ptBR.pdf").stat().st_size > 50000, "PDF missing"
          print(f"Validated {len(translated)} Markdown characters, {len(pdf.pages)} PDF pages")
          PY

      - name: Commit and push both pt-BR deliverables
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README-ptBR.md README-ptBR.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish full contextual pt-BR README and illustrated PDF"
            git push
          fi
