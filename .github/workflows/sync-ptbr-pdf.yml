name: Sync pt-BR illustrated PDF after editorial changes
on:
  push:
    branches: [main]
    paths:
      - README-ptBR.md
      - scripts/build_pdf_ptBR.py
      - scripts/cover_footer.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: python -m pip install 'markdown-it-py>=3,<5' 'weasyprint>=62,<70' 'pypdf>=5,<8' 'pymupdf>=1.24,<2'
      - name: Rebuild pt-BR illustrated edition
        run: python scripts/build_pdf_ptBR.py
      - name: Commit and push refreshed pt-BR PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README-ptBR.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize pt-BR PDF after language editing"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
